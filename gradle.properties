# Project-wide Gradle settings.

# AndroidX is required for modern Android dependencies (Material, AppCompat, etc.)
android.useAndroidX=true

# Auto-migrate any legacy support library references to AndroidX
android.enableJetifier=true

# Kotlin code style for this project
kotlin.code.style=official

# Performance: enable configuration cache
org.gradle.configuration-cache=true

# Performance: parallel project execution
org.gradle.parallel=true

# JVM args - reasonable defaults for a 2-core CI runner
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Non-transitive R class for faster builds
android.nonTransitiveRClass=true

# Suppress the AGP 8.2.2 / compileSdk 35 warning (still works fine for this build)
android.suppressUnsupportedCompileSdk=35
