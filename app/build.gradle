plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Kotlin 2.x Compose compiler (required: Haze 1.6.5 ships Kotlin 2.x metadata)
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.netscanner'
    compileSdk 35

    defaultConfig {
        applicationId "com.netscanner"
        minSdk 26
        targetSdk 35
        versionCode 63
        versionName "5.3.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.20'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.20'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.20'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    implementation 'com.jcraft:jsch:0.1.55'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Jetpack Compose (BOM-managed versions) Ã¢â‚¬â€ v5 is pure Compose, no XML UI
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Glassmorphism: Haze real-time backdrop blur for chrome surfaces
    // (top bar / primary scan card / bottom actions); scrim fallback < API 31.
    implementation 'dev.chrisbanes.haze:haze:1.6.5'
}
